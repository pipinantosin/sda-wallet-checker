<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDA Wallet Checker</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</style>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/form.css">
<link rel="stylesheet" href="css/button.css">
<link rel="stylesheet" href="css/address.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/tabs.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/animation.css">
<link rel="stylesheet" href="css/components.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a00">

<!-- PWA support iOS -->
<link rel="apple-touch-icon" href="img/sda.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
	
<!-- SPLASH SCREEN -->
<div id="splash">
    <img src="img/sda.png" alt="SDA Logo">
</div>

<div class="app">

<!-- HEADER -->
<div class="header">

    <div class="header-left">
        <div class="logo">
            <img src="img/sda.png" alt="SDA Logo">
        </div>
        <div class="title">SDA Wallet Checker</div>
    </div>

    <div class="header-right">

    <i class="fa-regular fa-bell"></i>

    <div class="menu-wrapper">
        <div class="menu-wrapper">

    <i class="fa-solid fa-globe" onclick="toggleMenu()"></i>

   <div id="menuDropdown" class="menu-dropdown">

    <div class="lang-item" onclick="setLanguage('id')"> Indonesia</div>
    <div class="lang-item" onclick="setLanguage('en')"> English</div>

</div>

</div>
    </div>

</div>

</div>

<!-- CARD -->
<div class="card">

   <div style="display:flex; justify-content:space-between; align-items:center;">

    <div class="label" data-lang="assets">Assets</div>

    <div class="token-dropdown">

        <img id="tokenLogoDropdown"
         src="img/sda.png"
         class="token-logo" />

        <select id="tokenSelect" style="background:transparent; border:none; padding:0; font-size:12px;">
        </select>

    </div>

</div>
   
<!-- CARD HEADER -->
<div class="card-header">

    <div id="activeWalletName">
    No Wallet Selected
</div>

    <div class="card-actions">
        <i class="fa-solid fa-rotate" onclick="refreshAll()"></i>
        <i class="fa-solid fa-gear" onclick="openWalletSetting()"></i>
    </div>

</div>

<!-- BALANCE + LOGO -->
<div style="display:flex; align-items:center; justify-content:center; gap:10px;">

    <img id="tokenLogoBalance"
     src="img/sda.png"
     class="token-logo" />

    <div class="balance" id="balance">0.00 SDA</div>

    <div id="cacheLabel"
         style="font-size:11px; color:#888; text-align:center; display:none;"
         data-lang="cached">
        cached
    </div>

</div>

<div style="margin-top:15px; text-align:center;">

<div class="text-center-small" data-lang="realtime">
    Real-time data from Sidra Node
</div>

<div class="label" data-lang="select_wallet">Select Wallet</div>

<div style="display:flex; align-items:center; gap:8px;">

    <i class="fa-solid fa-wallet"
       style="color:#ff7a00; font-size:16px;"></i>

    <select id="walletSelect" style="flex:1;"></select>

</div>

<!-- ADDRESS + COPY -->
<div class="address-bar">

    <div id="showAddress" class="address-text"></div>

    <div class="address-actions">

        <i class="fa-solid fa-qrcode" onclick="openQRModal()"></i>

        <i class="fa-regular fa-copy" onclick="copyAddress()"></i>

    </div>

</div>

<div class="input-group">
    <i class="fa-solid fa-link"></i>
    <input type="text"
           id="address"
           data-lang-placeholder="enter_address"
           placeholder="Enter 0x Address..." />
</div>

<div class="input-group">
    <i class="fa-solid fa-tag"></i>
    <input type="text"
           id="walletName"
           data-lang-placeholder="wallet_name"
           placeholder="Wallet Name (optional)" />
</div>

<button onclick="saveWallet()">
    <i class="fa-solid fa-floppy-disk"></i>
    <span data-lang="save_wallet">Save Wallet</span>
</button>

<!-- ACTION ICONS -->
<div class="actions">

    <div>
        <i class="fa-solid fa-arrow-up" style="background:#2b1405; color:#ff7a00;"></i>
        <span data-lang="send">Send</span>
    </div>

    <div onclick="showReceive()">
        <i class="fa-solid fa-arrow-down" style="background:#0d1f3a; color:#3aa0ff;"></i>
        <span data-lang="receive">Receive</span>
    </div>

    <div>
        <i class="fa-solid fa-right-left" style="background:#2a123a; color:#c77dff;"></i>
        <span data-lang="swap">Swap</span>
    </div>

    <div>
        <i class="fa-solid fa-droplet" style="background:#0a2a2a; color:#00e0ff;"></i>
        <span data-lang="liquidity">Liquidity</span>
    </div>

</div>

<!-- WALLET MODAL -->
<div id="walletModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <span data-lang="edit_wallet">Edit Wallet</span>
            <span onclick="closeWalletSetting()">׼/span>
        </div>

        <input type="text"
               id="editWalletName"
               data-lang-placeholder="wallet_name"
               placeholder="Wallet Name"
               style="margin-bottom:10px;" />

        <button onclick="saveWalletName()">
            <i class="fa-solid fa-floppy-disk"></i>
            <span data-lang="save">Save</span>
        </button>

        <button onclick="deleteWallet()" style="background:#ff3b3b;">
            <i class="fa-solid fa-trash"></i>
            <span data-lang="delete">Delete</span>
        </button>

    </div>

</div>

<!-- RECEIVE MODAL -->
<div id="receiveModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <span data-lang="receive">Receive</span>
            <span onclick="closeReceiveModal()">׼/span>
        </div>

        <img id="receiveQR"
             style="width:140px; display:block; margin:10px auto;
             border-radius:12px; background:#111; padding:8px;" />

        <div id="receiveAddress"
             style="font-size:12px; text-align:center; color:#aaa; margin-bottom:10px;">
        </div>

        <input type="number"
               id="receiveAmount"
               data-lang-placeholder="amount_optional"
               placeholder="Amount (optional)"
               style="margin-bottom:8px;" />

        <div id="receiveResult" style="display:none;">

            <input id="receiveLink"
                   readonly
                   style="font-size:11px; margin-top:8px;" />

            <button onclick="copyReceiveLink()">
                <i class="fa-solid fa-copy"></i>
                <span data-lang="copy_link">Copy Link</span>
            </button>

            <button onclick="shareWA()">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </button>

            <button onclick="shareTelegram()">
                <i class="fa-brands fa-telegram"></i> Telegram
            </button>

        </div>

    </div>

</div>

<!-- TABS -->
<div class="tabs">

    <div class="tab active" onclick="switchTab('assets')" data-lang="assets">Assets</div>
    <div class="tab" onclick="switchTab('tokens')" data-lang="tokens">Tokens</div>
    <div class="tab" onclick="switchTab('lp')" data-lang="lp">LP</div>

</div>

<div id="tab-assets" class="tab-content active"></div>
<div id="tab-tokens" class="tab-content"></div>
<div id="tab-lp" class="tab-content"></div>

<!-- TOAST -->
<div id="toast" style="
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:#fff;
padding:10px 16px;
border-radius:8px;
font-size:12px;
display:none;
z-index:9999;
border:1px solid #333;
"></div>

<!-- QR MODAL -->
<div id="qrModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <span><i class="fa-solid fa-qrcode"></i> Wallet QR</span>
            <span onclick="closeQRModal()">
                <i class="fa-solid fa-xmark"></i>
            </span>
        </div>

        <img id="qrModalImg"
             style="
             width:170px;
             display:block;
             margin:15px auto;
             border-radius:12px;
             background:#111;
             padding:10px;
             " />

        <div id="qrModalAddress"
             style="
             font-size:12px;
             text-align:center;
             color:#aaa;
             word-break:break-all;
             margin-bottom:10px;
             ">
        </div>

        <button onclick="copyAddress()">
            <i class="fa-solid fa-copy"></i> Copy Address
        </button>

    </div>

</div>

<!-- ETHERS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>


<script src="js/wallet.js"></script>
<script src="js/tokens.js"></script>
<script src="js/tokenManager.js"></script>
<script src="js/lp.js"></script>
<script src="js/balance.js"></script>

<script src="js/ui-core.js"></script>
<script src="js/ui.js"></script>

<script src="js/lang.js"></script>
<script src="js/app.js"></script>

<script src="sw.js"></script>

<script>
function toggleMenu(){
    const menu = document.getElementById("menuDropdown");
    menu.style.display =
        menu.style.display === "flex" ? "none" : "flex";
}


</script>

<script>
loadLang();
</script>

<script>

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(reg => {

            console.log("SW registered");

            reg.onupdatefound = () => {
                const newWorker = reg.installing;

                newWorker.onstatechange = () => {
                    if (newWorker.state === "installed") {
                        if (navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    }
                };
            };

        })
        .catch(err => console.log("SW error:", err));
}


</script>


</body>
</html>
