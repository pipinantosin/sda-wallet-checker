<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDA Wallet Checker</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0c0c0c;
    color:#fff;
    display:flex;
    justify-content:center;
    padding:20px;
}

.app{
    width:360px;
}

/* HEADER */
.header{
    background:#111;
    padding:15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.logo{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 10px rgba(255,122,0,0.4);
    overflow:hidden;
}

.logo img{
    width:70%;
    height:70%;
    object-fit:contain;
}

/* CARD */
.card{
    background:#111;
    border-radius:14px;
    padding:18px;
    border:1px solid #222;
}

.card > *{
    margin-bottom:10px;
}

/* BALANCE */
.balance{
    font-size:28px;
    font-weight:bold;
    margin:10px 0;
    color:#fff;
    text-align:center;
    text-shadow:0 0 10px rgba(255,122,0,0.6);

    /* 🔥 TAMBAHAN */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.label{
    color:#aaa;
    font-size:14px;
}

/* INPUT */
input, select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    margin-top:10px;
    background:#1a1a1a;
    color:#fff;
}

.input-group{
    display:flex;
    align-items:center;
    background:#1a1a1a;
    border-radius:10px;
    padding:0 12px;
    margin-top:10px;
    border:1px solid #222;
}

.input-group i{
    color:#ff7a00;
    font-size:14px;
    margin-right:8px;
}

.input-group input{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 0;
    color:#fff;
    font-size:14px;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff7a00;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e56c00;
}

button i{
    margin-right:8px;
}

/* WALLET ROW */
.wallet-row{
    margin-top:10px;
    font-size:12px;
    color:#aaa;
    word-break:break-all;
}

/* ACTIONS */
.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions div{
    flex:1;
    background:#1a1a1a;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
}

/* SPLASH */
#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    flex-direction:column;
}

#splash img{
    width:90px;
    animation:zoomIn 1s ease, glow 1.5s infinite alternate;
}

/* ANIMASI MASUK */
@keyframes zoomIn{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* GLOW EFFECT */
@keyframes glow{
    from{
        filter:drop-shadow(0 0 5px rgba(255,122,0,0.3));
    }
    to{
        filter:drop-shadow(0 0 20px rgba(255,122,0,0.8));
    }
}

@keyframes blinkGlow {
    0% { box-shadow: 0 0 0 rgba(255,122,0,0); }
    50% { box-shadow: 0 0 15px rgba(255,122,0,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,122,0,0); }
}

.blink {
    animation: blinkGlow 1s infinite;
    border:1px solid #ff7a00 !important;
}

#tokenLogo {
    box-shadow: 0 0 10px rgba(255,122,0,0.5);
}

</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a00">

<!-- PWA support iOS -->
<link rel="apple-touch-icon" href="img/sda.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
	
<!-- SPLASH SCREEN -->
<div id="splash">
    <img src="img/sda.png" alt="SDA Logo">
</div>

<div class="app">

<!-- HEADER -->
<div class="header">
    <div class="logo">
    <img src="img/sda.png" alt="SDA Logo">
</div>
    <div><b>Sidra Chain</b></div>
</div>

<!-- CARD -->
<div class="card">

   <div class="label">Asset</div>

<!-- 🔥 BALANCE + LOGO -->
<div style="display:flex; align-items:center; justify-content:center; gap:10px;">

    <img id="tokenLogo"
         src="img/sda.png"
         style="width:28px; height:28px; border-radius:50%; background:#111; padding:3px;" />

    <div class="balance" id="balance">0.00 SDA</div>

</div>
    
    <div style="margin-top:15px; text-align:center;">

<div style="text-align:center; font-size:12px; color:#888;">
    Real-time data from Sidra Node
</div>

    <!-- QR -->
    <img id="qrCode"
     src=""
     style="display:none; width:130px; height:130px; margin:15px auto;
     border-radius:16px; background:#111; padding:8px;" />


    <!-- ADDRESS + COPY -->
    <div style="display:flex; gap:8px; align-items:center; background:#1a1a1a; padding:10px; border-radius:12px; margin-top:10px;">

    <div id="showAddress"
         style="flex:1; font-size:12px; word-break:break-all; color:#aaa;">
        -
    </div>

    <button onclick="copyAddress()"
            style="width:auto; padding:6px 10px; font-size:12px; border-radius:8px;">
        <i class="fa-solid fa-copy"></i>
    </button>

</div>

    <div class="label">Pilih Token</div>
<div style="display:flex; align-items:center; gap:8px;">

    <img id="tokenLogo"
         src="img/sda.png"
         style="width:24px; height:24px; border-radius:50%; background:#111; padding:2px;" />

    <select id="tokenSelect" style="flex:1;"></select>

</div>

<div class="label">Pilih Wallet</div>
<select id="walletSelect"></select>
    
    <div class="actions">
    <div onclick="renameWallet()">
        <i class="fa-solid fa-pen"></i><br>Rename
    </div>
    
    <div onclick="deleteWallet()">
        <i class="fa-solid fa-trash"></i><br>Delete
    </div>
    <div onclick="loadBalance()">
        <i class="fa-solid fa-rotate"></i><br>Refresh
    </div>
</div>


  <div class="input-group">
    <i class="fa-solid fa-link"></i>
    <input type="text" id="address" placeholder="Input Address 0x..." />
</div>

<div class="input-group">
    <i class="fa-solid fa-tag"></i>
    <input type="text" id="walletName" placeholder="Nama Wallet (opsional)" />
</div>

    <button onclick="saveWallet()">
    <i class="fa-solid fa-floppy-disk"></i> Simpan Wallet
</button>

<button onclick="loadBalance()">
    <i class="fa-solid fa-rotate"></i> Cek Balance
</button>


    <!-- ACTION ICON STYLE -->
    <div class="actions">
    <div onclick="showReceive()">
        <i class="fa-solid fa-download"></i><br>Receive
    </div>

    <div style="opacity:0.4;">
        <i class="fa-solid fa-paper-plane"></i><br>Send
    </div>

    <div style="opacity:0.4;">
        <i class="fa-solid fa-right-left"></i><br>Swap
    </div>
</div>

<div id="receiveBox" style="display:none; margin-top:10px;">

    <div id="receiveForm">
        <input type="number" id="receiveAmount"
               placeholder="Jumlah SDA (opsional)"
               style="margin-bottom:8px;" />

        <button onclick="generateReceiveLink()">
            Generate Link
        </button>
    </div>

    <div id="receiveResult" style="display:none;">

        <input id="receiveLink"
               readonly
               style="font-size:11px; margin-top:8px;" />

        <button onclick="copyReceiveLink()">
            <i class="fa-solid fa-copy"></i> Copy Link
        </button>

        <div class="actions">
            <div onclick="shareWA()">
                <i class="fa-brands fa-whatsapp"></i><br>WA
            </div>

            <div onclick="shareTelegram()">
                <i class="fa-brands fa-telegram"></i><br>Telegram
            </div>
        </div>

    </div>

</div>


<!-- ETHERS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script src="tokenManager.js"></script>
<script src="main.js"></script>

<script>
// CONFIG
const RPC = "https://node.sidrachain.com/";
const provider = new ethers.providers.JsonRpcProvider(RPC);

// STORAGE KEY
const KEY = "sda_wallets";

// ELEMENT
const balanceEl = document.getElementById("balance");
const selectEl = document.getElementById("walletSelect");

selectEl.addEventListener("change", () => {
    loadBalance();
});

document.getElementById("tokenSelect")
    .addEventListener("change", loadBalance);

// LOAD STORAGE
function getWallets(){
    return JSON.parse(localStorage.getItem(KEY) || "[]");
}

// SAVE STORAGE
function setWallets(data){
    localStorage.setItem(KEY, JSON.stringify(data));
}

// RENDER DROPDOWN
function renderWallets(){
    const wallets = getWallets();
    selectEl.innerHTML = "";

    wallets.forEach((w,i)=>{
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = w.name || ("Wallet "+(i+1));
        selectEl.appendChild(opt);
    });
}

function renderTokenSelect(){
    const select = document.getElementById("tokenSelect");

    select.innerHTML = `
        <option value="native">SDA</option>
    `;

    TOKENS.forEach((t,i)=>{
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = t.symbol;
        select.appendChild(opt);
    });
    
    const tokenSelect = document.getElementById("tokenSelect");
const tokenLogo = document.getElementById("tokenLogo");

tokenSelect.addEventListener("change", () => {

    const val = tokenSelect.value;

    if(val === "native"){
        tokenLogo.src = "img/sda.png";
    }else{
        const token = TOKENS[val];
        tokenLogo.src = token.logo || "img/default.png";
    }

    loadBalance();
});
}

// SAVE WALLET
function saveWallet(){
    let addr = document.getElementById("address").value.trim().toLowerCase();
    const name = document.getElementById("walletName").value.trim();

    if(!addr) return alert("Isi address dulu");

    // VALIDASI BASIC ADDRESS
    if(!addr.startsWith("0x") || addr.length < 20){
        return alert("Format address tidak valid");
    }

    const wallets = getWallets();

    // CEGAH DUPLIKAT
    const isExist = wallets.some(w => w.address.toLowerCase() === addr);

    if(isExist){
        return alert("Wallet sudah tersimpan");
    }

    wallets.push({
        address: addr,
        name: name || "Wallet"
    });

    setWallets(wallets);
    renderWallets();

    // reset input
    document.getElementById("address").value = "";
    document.getElementById("walletName").value = "";

    alert("Wallet berhasil disimpan");
    
    setWallets(wallets);
renderWallets();

// 👉 pindah ke wallet terakhir (yang baru disimpan)
selectEl.value = wallets.length - 1;

// 👉 langsung load wallet baru
loadBalance();
}

// GET SELECTED
function getSelectedWallet(){
    const wallets = getWallets();
    const index = selectEl.value;
    return wallets[index];
}

function renameWallet(){
    const wallets = getWallets();
    const index = selectEl.value;

    if(index === "" || !wallets[index]){
        return alert("Pilih wallet dulu");
    }

    const newName = prompt("Masukkan nama baru:", wallets[index].name);

    if(!newName) return;

    wallets[index].name = newName;
    setWallets(wallets);
    renderWallets();

    alert("Nama wallet berhasil diubah");
}

function deleteWallet(){
    const wallets = getWallets();
    const index = selectEl.value;

    if(index === "" || !wallets[index]){
        return alert("Pilih wallet dulu");
    }

    const confirmDelete = confirm("Hapus wallet ini?");

    if(!confirmDelete) return;

    const deletedIndex = parseInt(index);

wallets.splice(deletedIndex, 1);
setWallets(wallets);
renderWallets();

const total = wallets.length;

if(total > 0){
    // 👉 pilih index aman
    let newIndex = deletedIndex - 1;

    if(newIndex < 0){
        newIndex = 0;
    }

    selectEl.value = newIndex;
    loadBalance();
} else {
    balanceEl.textContent = "0.00 SDA";
}

alert("Wallet dihapus");
}

// LOAD BALANCE SDA
async function loadBalance(){

    const wallet = getSelectedWallet();
    const tokenVal = document.getElementById("tokenSelect").value;
    const qr = document.getElementById("qrCode");

    if(!wallet){
        qr.style.display = "none";
        qr.src = "";
        document.getElementById("showAddress").textContent = "-";
        balanceEl.textContent = "0.00 SDA";
        return;
    }

    balanceEl.textContent = "Loading...";
    document.getElementById("showAddress").textContent = wallet.address;

    // 🔥 CACHE KEY
    const cacheKey = wallet.address + "_" + tokenVal;

    // 🔥 TAMPILKAN CACHE DULU (kalau ada)
    const cached = localStorage.getItem(cacheKey);
    if(cached){
        balanceEl.textContent = cached + " (cached)";
    }

    try{

        // ======================
        // SDA
        // ======================
        if(tokenVal === "native"){

            const bal = await provider.getBalance(wallet.address);

            const result = parseFloat(
                ethers.utils.formatEther(bal)
            ).toFixed(4);

            balanceEl.textContent = result + " SDA";

            // 🔥 simpan cache
            localStorage.setItem(cacheKey, result + " SDA");

        }else{

            // ======================
            // TOKEN
            // ======================
            const token = TOKENS[tokenVal];

            const abi = [
                "function balanceOf(address) view returns (uint256)",
                "function decimals() view returns (uint8)"
            ];

            const contract = new ethers.Contract(
                token.address,
                abi,
                provider
            );

            const bal = await contract.balanceOf(wallet.address);

            let decimals = 18;

            try{
                decimals = await contract.decimals();
            }catch(e){
                console.warn("Decimals fallback 18");
            }

            const result = bal / (10 ** decimals);

            const final = parseFloat(result).toFixed(4) + " " + token.symbol;

            balanceEl.textContent = final;

            // 🔥 simpan cache
            localStorage.setItem(cacheKey, final);
        }

        // QR
        qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + wallet.address;
        qr.style.display = "block";

    }catch(e){
        console.error(e);
        balanceEl.textContent = "Error";
        qr.style.display = "none";
    }
}

function copyAddress(){
    const wallet = getSelectedWallet();

    if(!wallet){
        return alert("Pilih wallet dulu");
    }

    navigator.clipboard.writeText(wallet.address)
        .then(() => {
            alert("Address copied");
        })
        .catch(() => {
            alert("Gagal copy");
        });
}

// SPLASH CONTROL
window.addEventListener("load", ()=>{
    setTimeout(()=>{
        document.getElementById("splash").style.opacity = "0";
        document.getElementById("splash").style.transition = "0.5s";

        setTimeout(()=>{
            document.getElementById("splash").style.display = "none";
        },500);

    },1500); // durasi splash (1.5 detik)
});

function showReceive(){
    const wallet = getSelectedWallet();

    if(!wallet){
        return alert("Pilih wallet dulu");
    }

    // tampilkan QR
    document.getElementById("qrCode").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + wallet.address;

    document.getElementById("showAddress").textContent = wallet.address;

    // tampilkan input receive
    document.getElementById("receiveBox").style.display = "block";
}

function generateReceiveLink(){
    const wallet = getSelectedWallet();
    const amount = document.getElementById("receiveAmount").value;

    if(!wallet){
        return alert("Pilih wallet dulu");
    }

    let link = `https://www.sidrachain.com/wallets/send?to=${wallet.address}&currency=SDA`;

    if(amount && amount > 0){
        link += `&amount=${amount}`;
    }

    document.getElementById("receiveLink").value = link;

    window.receiveLink = link;

    // 🔥 HIDE FORM
    document.getElementById("receiveForm").style.display = "none";

    // 🔥 SHOW RESULT
    document.getElementById("receiveResult").style.display = "block";
}

function copyReceiveLink(){
    if(!window.receiveLink){
        return alert("Generate link dulu");
    }

    navigator.clipboard.writeText(window.receiveLink);
    alert("Link disalin");
}


function shareWA(){
    if(!window.receiveLink){
        return alert("Generate link dulu");
    }

    const text = encodeURIComponent("Kirim SDA ke saya:\n" + window.receiveLink);
    window.open(`https://wa.me/?text=${text}`, "_blank");
}

function shareTelegram(){
    if(!window.receiveLink){
        return alert("Generate link dulu");
    }

    const text = encodeURIComponent("Kirim SDA ke saya:\n" + window.receiveLink);
    window.open(`https://t.me/share/url?url=${text}`, "_blank");
}



const addressInput = document.getElementById("address");
const saveBtn = document.querySelector("button[onclick='saveWallet()']");
const checkBtn = document.querySelector("button[onclick='loadBalance()']");

// STEP 1
function startGuide(){
    addressInput.classList.add("blink");
}

// jalankan kalau belum ada wallet
const wallets = getWallets();
if(wallets.length === 0){
    startGuide();
}

addressInput.addEventListener("input", () => {
    if(addressInput.value.length > 5){
        addressInput.classList.remove("blink");
        saveBtn.classList.add("blink");
    }
});

addressInput.addEventListener("input", () => {
    if(addressInput.value.length > 5){
        addressInput.classList.remove("blink");
        saveBtn.classList.add("blink");
    }
});

saveBtn.addEventListener("click", () => {
    saveBtn.classList.remove("blink");
    checkBtn.classList.add("blink");
});


// INIT
window.onload = () => {
    renderWallets();
    renderTokenSelect();
    tokenLogo.src = "img/sda.png";

    // 🔥 WAJIB: event token change
    document.getElementById("tokenSelect")
        .addEventListener("change", loadBalance);

    const wallets = getWallets();

    document.getElementById("qrCode").style.display = "none";

    if(wallets.length > 0){
        selectEl.value = 0;
        loadBalance();
    } else {
        startGuide();
    }
};


if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(reg => {

            console.log("SW registered");

            reg.onupdatefound = () => {
                const newWorker = reg.installing;

                newWorker.onstatechange = () => {
                    if (newWorker.state === "installed") {
                        if (navigator.serviceWorker.controller) {
                            window.location.reload();
                        }
                    }
                };
            };

        })
        .catch(err => console.log("SW error:", err));
}

</script>


</body>
</html>
