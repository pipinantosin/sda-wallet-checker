<!DOCTYPE html>
<html lang="id">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0c0c0c;
    color:#fff;
    display:flex;
    justify-content:center;
    padding:20px;
}

.app{
    width:360px;
}

/* HEADER */
.header{
    background:#111;
    padding:15px;
    border-radius:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-right{
    display:flex;
    gap:12px;
}

.header-right i{
    font-size:16px;
    padding:10px;
    border-radius:10px;
    background:#1a1a1a;
    cursor:pointer;
}

.logo{
    width:40px;
    height:40px;
    border-radius:10px;
    background:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 10px rgba(255,122,0,0.4);
    overflow:hidden;
}

.logo img{
    width:70%;
    height:70%;
    object-fit:contain;
}



/* CARD */
.card{
    background:#111;
    border-radius:14px;
    padding:18px;
    border:1px solid #222;
}

.card > *{
    margin-bottom:10px;
}

/* BALANCE */
.balance{
    font-size:28px;
    font-weight:bold;
    margin:10px 0;
    color:#fff;
    text-align:center;
    text-shadow:0 0 10px rgba(255,122,0,0.6);

    /* 🔥 TAMBAHAN */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.label{
    color:#aaa;
    font-size:14px;
}

/* INPUT */
input, select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    margin-top:10px;
    background:#1a1a1a;
    color:#fff;
}

.input-group{
    display:flex;
    align-items:center;
    background:#1a1a1a;
    border-radius:10px;
    padding:0 12px;
    margin-top:10px;
    border:1px solid #222;
}

.input-group i{
    color:#ff7a00;
    font-size:14px;
    margin-right:8px;
}

.input-group input{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 0;
    color:#fff;
    font-size:14px;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#ff7a00;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e56c00;
}

button i{
    margin-right:8px;
}

button:disabled{
    opacity:0.4;
    cursor:not-allowed;
}

.input-valid{
    border:1px solid #00ff99 !important;
}

.input-invalid{
    border:1px solid #ff4d4d !important;
}

/* WALLET ROW */
.wallet-row{
    margin-top:10px;
    font-size:12px;
    color:#aaa;
    word-break:break-all;
}

/* ACTIONS */
.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.actions div{
    flex:1;
    background:#1a1a1a;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:12px;
}


.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

#activeWalletName{
    font-size:14px;
    font-weight:bold;
    color:#fff;
}

.card-actions{
    display:flex;
    gap:10px;
}

.card-actions i{
    background:#1a1a1a;
    padding:8px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
}

/* SPLASH */
#splash{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    flex-direction:column;
}

#splash img{
    width:90px;
    animation:zoomIn 1s ease, glow 1.5s infinite alternate;
}

/* ANIMASI MASUK */
@keyframes zoomIn{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* GLOW EFFECT */
@keyframes glow{
    from{
        filter:drop-shadow(0 0 5px rgba(255,122,0,0.3));
    }
    to{
        filter:drop-shadow(0 0 20px rgba(255,122,0,0.8));
    }
}

@keyframes blinkGlow {
    0% { box-shadow: 0 0 0 rgba(255,122,0,0); }
    50% { box-shadow: 0 0 15px rgba(255,122,0,0.9); }
    100% { box-shadow: 0 0 0 rgba(255,122,0,0); }
}

.blink {
    animation: blinkGlow 1s infinite;
    border:1px solid #ff7a00 !important;
}

#tokenLogo {
    box-shadow: 0 0 10px rgba(255,122,0,0.5);
}

#cacheLabel{
    opacity:0.7;
}

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:#111;
    padding:20px;
    border-radius:14px;
    width:280px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
}

.modal-header span{
    cursor:pointer;
}

.card-actions i:hover,
.header-right i:hover{
    background:#ff7a00;
}

.tabs{
    display:flex;
    margin-top:15px;
    background:#111;
    border-radius:12px;
    overflow:hidden;
}

.tab{
    flex:1;
    text-align:center;
    padding:12px;
    cursor:pointer;
    font-size:13px;
    color:#aaa;
}

.tab.active{
    background:#ff7a00;
    color:#fff;
}

.tab-content{
    display:none;
    background:#111;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
}

.tab-content.active{
    display:block;
}

.asset-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    border-bottom:1px solid #222;
}
</style>

<div id="toast" style="
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:#fff;
padding:10px 16px;
border-radius:8px;
font-size:12px;
display:none;
z-index:9999;
border:1px solid #333;
"></div>

<!-- ETHERS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

<script src="tokenManager.js"></script>
<script src="main.js"></script>

<script>
// CONFIG
const RPC = "https://node.sidrachain.com/";
const provider = new ethers.providers.JsonRpcProvider(RPC);

// STORAGE KEY
const KEY = "sda_wallets";

// ELEMENT
const balanceEl = document.getElementById("balance");
const selectEl = document.getElementById("walletSelect");

selectEl.addEventListener("change", () => {

    updateActiveWalletName();

    //  langsung render cache dulu
    renderAssets();

    loadBalance();

    //  auto refresh TANPA DELAY lama
    setTimeout(()=>{
        autoRefreshIfNeeded();
    },100);
});


function autoRefreshIfNeeded(){

    const wallet = getSelectedWallet();
    if(!wallet) return;

    const address = wallet.address;

    // cek SDA
    const hasSDA = localStorage.getItem(address + "_native");

    // cek semua token
    const tokens = (customTokens || []).slice(0,10);

    let missingToken = false;

    tokens.forEach(token=>{
        const key = address + "_" + token.address;
        if(!localStorage.getItem(key)){
            missingToken = true;
        }
    });

    //  RULE BARU:
    // kalau SDA belum ada ATAU ada token yg belum ada cache  refresh
    if(!hasSDA || missingToken){
        refreshAll();
    }
}

// LOAD STORAGE
function getWallets(){
    return JSON.parse(localStorage.getItem(KEY) || "[]");
}

// SAVE STORAGE
function setWallets(data){
    localStorage.setItem(KEY, JSON.stringify(data));
}

// RENDER DROPDOWN
function renderWallets(){
    const wallets = getWallets();
    selectEl.innerHTML = "";

    wallets.forEach((w,i)=>{
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = w.name || ("Wallet "+(i+1));
        selectEl.appendChild(opt);
    });
}

function renderTokenSelect(){
    const select = document.getElementById("tokenSelect");

    select.innerHTML = `
        <option value="native">SDA</option>
    `;

    TOKENS.forEach((t,i)=>{
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = t.symbol;
        select.appendChild(opt);
    });
    
    const tokenSelect = document.getElementById("tokenSelect");
const tokenLogoBalance = document.getElementById("tokenLogoBalance");
const tokenLogoDropdown = document.getElementById("tokenLogoDropdown");

tokenSelect.addEventListener("change", () => {

    const val = tokenSelect.value;

    let logo = "img/sda.png";

    if(val !== "native"){
        const token = TOKENS[val];
        logo = token.logo || "img/default.png";
    }

    //  update keduanya
    tokenLogoBalance.src = logo;
    tokenLogoDropdown.src = logo;

    loadBalance();
});
}

// SAVE WALLET
function saveWallet(){
    let addr = document.getElementById("address").value.trim().toLowerCase();
    const name = document.getElementById("walletName").value.trim();

    if(!addr) return alert("Isi address dulu");

    // VALIDASI BASIC ADDRESS
    if(!addr.startsWith("0x") || addr.length < 20){
        return alert("Format address tidak valid");
    }

    const wallets = getWallets();

    // CEGAH DUPLIKAT
    const isExist = wallets.some(w => w.address.toLowerCase() === addr);

    if(isExist){
        return alert("Wallet sudah tersimpan");
    }

    wallets.push({
        address: addr,
        name: name || "Wallet"
    });

    setWallets(wallets);
    renderWallets();

   // reset input
document.getElementById("address").value = "";
document.getElementById("walletName").value = "";

// 🔥 update state tombol
validateInput();

    alert("Wallet berhasil disimpan");
    
    setWallets(wallets);
renderWallets();

// 👉 pindah ke wallet terakhir (yang baru disimpan)
selectEl.value = wallets.length - 1;

// render dulu (biar ga kosong)
renderAssets();

// load balance cepat
loadBalance();

// auto fetch real data
setTimeout(()=>{
    autoRefreshIfNeeded();
},150);

// 👉 langsung load wallet baru
loadBalance();

// 🔥 stop semua blink setelah wallet pertama tersimpan
document.querySelectorAll(".blink").forEach(el => el.classList.remove("blink"));
}

// GET SELECTED
function getSelectedWallet(){
    const wallets = getWallets();
    const index = selectEl.value;
    return wallets[index];
}

function renameWallet(){
    const wallets = getWallets();
    const index = selectEl.value;

    if(index === "" || !wallets[index]){
        return alert("Pilih wallet dulu");
    }

    const newName = prompt("Masukkan nama baru:", wallets[index].name);

    if(!newName) return;

    wallets[index].name = newName;
    setWallets(wallets);
    renderWallets();

    alert("Nama wallet berhasil diubah");
}


function saveWalletName(){
    const wallets = getWallets();
    const index = selectEl.value;

    if(index === "" || !wallets[index]){
        return alert("Pilih wallet dulu");
    }

    const newName = document.getElementById("editWalletName").value.trim();

    if(!newName){
        return alert("Nama tidak boleh kosong");
    }

    wallets[index].name = newName;

    setWallets(wallets);
    renderWallets();

    // update UI
    updateActiveWalletName();

    closeWalletSetting();

    alert("Nama wallet disimpan");
}



function deleteWallet(){
    const wallets = getWallets();
    const index = selectEl.value;

    if(index === "" || !wallets[index]){
        return alert("Pilih wallet dulu");
    }

    const confirmDelete = confirm("Hapus wallet ini?");

    if(!confirmDelete) return;

    const deletedIndex = parseInt(index);

wallets.splice(deletedIndex, 1);
setWallets(wallets);
renderWallets();

const total = wallets.length;

if(total > 0){
    // 👉 pilih index aman
    let newIndex = deletedIndex - 1;

    if(newIndex < 0){
        newIndex = 0;
    }

    selectEl.value = newIndex;

// render ulang UI
renderAssets();

// load balance
loadBalance();

// auto refresh kalau perlu
setTimeout(()=>{
    autoRefreshIfNeeded();
},150);

} else {
    balanceEl.textContent = "0.00 SDA";
    document.getElementById("tab-assets").innerHTML =
        "<div style='text-align:center;color:#888;'>No wallet</div>";
}

alert("Wallet dihapus");
}


function updateActiveWalletName(){
    const wallet = getSelectedWallet();

    const el = document.getElementById("activeWalletName");

    if(!wallet){
        el.textContent = "No Wallet";
        return;
    }

    el.textContent = wallet.name || "Wallet";
}

function openWalletSetting(){
    const wallet = getSelectedWallet();

    if(!wallet){
        return alert("Pilih wallet dulu");
    }

    // isi input dengan nama sekarang
    document.getElementById("editWalletName").value = wallet.name || "";

    document.getElementById("walletModal").style.display = "flex";
    setTimeout(()=>{
    document.getElementById("editWalletName").focus();
},100);
}

function closeWalletSetting(){
    document.getElementById("walletModal").style.display = "none";
}

// LOAD BALANCE SDA
async function loadBalance(){

    updateActiveWalletName();

    const wallet = getSelectedWallet();
    const tokenVal = document.getElementById("tokenSelect").value;
    const qr = document.getElementById("qrCode");

    if(!wallet){
        qr.style.display = "none";
        qr.src = "";
        document.getElementById("showAddress").textContent = "-";
        balanceEl.textContent = "0.00 SDA";
        return;
    }

    balanceEl.textContent = "Loading...";
    document.getElementById("showAddress").textContent = wallet.address;

    //  FIX: cache key benar
    const cacheKey = wallet.address + "_" + tokenVal;

    const cached = localStorage.getItem(cacheKey) || "...";
    const cacheLabel = document.getElementById("cacheLabel");

    if(cached){
        balanceEl.textContent = cached;
        cacheLabel.style.display = "block";
    } else {
        cacheLabel.style.display = "none";
    }

    try{

        if(tokenVal === "native"){

            const bal = await provider.getBalance(wallet.address);

            const result = parseFloat(
                ethers.utils.formatEther(bal)
            ).toFixed(4) + " SDA";

            balanceEl.textContent = result;
            cacheLabel.style.display = "none";

            localStorage.setItem(cacheKey, result);

        }else{

            const token = TOKENS[tokenVal];

            const abi = [
                "function balanceOf(address) view returns (uint256)",
                "function decimals() view returns (uint8)"
            ];

            const contract = new ethers.Contract(
                token.address,
                abi,
                provider
            );

            const bal = await contract.balanceOf(wallet.address);

            let decimals = 18;
            try{
                decimals = await contract.decimals();
            }catch{}

            const result = (bal / (10 ** decimals)).toFixed(4) + " " + token.symbol;

            balanceEl.textContent = result;
            cacheLabel.style.display = "none";

            localStorage.setItem(cacheKey, result);
        }

        qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + wallet.address;
        qr.style.display = "block";

    }catch(e){
        console.error(e);
        balanceEl.textContent = cached || "Error";
        qr.style.display = "none";
    }
}


async function refreshAll(){

    const wallet = getSelectedWallet();
    if(!wallet) return;

    const currentAddress = wallet.address; //  lock wallet

    showToast("Refreshing...");

    // ======================
    // SDA
    // ======================
    try{
        const bal = await provider.getBalance(currentAddress);

        const result = parseFloat(
            ethers.utils.formatEther(bal)
        ).toFixed(4) + " SDA";

        localStorage.setItem(currentAddress + "_native", result);

    }catch(e){
        console.warn("SDA error");
    }

    // ======================
    // TOKEN PARALLEL
    // ======================
    const list = (customTokens || []).slice(0,10);

    await Promise.all(list.map(async (token)=>{

        try{
            const abi = [
                "function balanceOf(address) view returns (uint256)",
                "function decimals() view returns (uint8)"
            ];

            const contract = new ethers.Contract(
                token.address,
                abi,
                provider
            );

            const [bal, decimalsRaw] = await Promise.all([
                contract.balanceOf(currentAddress),
                contract.decimals().catch(()=>18)
            ]);

            //  FIX BigNumber pakai ethers
            const value = parseFloat(
                ethers.utils.formatUnits(bal, decimalsRaw)
            ).toFixed(4);

            const final = value + " " + token.symbol;

            localStorage.setItem(
                currentAddress + "_" + token.address,
                final
            );

        }catch(e){
            console.warn("Token error:", token.symbol);
        }

    }));

    //  pastikan wallet belum berubah
    const latestWallet = getSelectedWallet();
    if(!latestWallet || latestWallet.address !== currentAddress){
        return; // stop kalau user ganti wallet saat proses
    }

    //  render setelah cache siap
    loadBalance();

    setTimeout(()=>{
        renderAssets();
    },100);

    showToast("Refresh selesai");
    
    //  render 2x (instant + final)
renderAssets();

setTimeout(()=>{
    renderAssets();
},200);
}

function renderAssets(){

    const container = document.getElementById("tab-assets");
    const wallet = getSelectedWallet();

    if(!wallet){
        container.innerHTML = "<div style='color:#888;text-align:center;'>No wallet</div>";
        return;
    }

    let html = "";

    // =====================
    // SDA (CACHE)
    // =====================
    const sdaCache = localStorage.getItem(wallet.address + "_native") || "0.00 SDA";

    html += `
    <div class="asset-item">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="img/sda.png" style="width:32px; height:32px; border-radius:50%;" />
            <div>
                <b>SDA</b><br>
                <small style="color:#888;">Native Token</small>
            </div>
        </div>
        <div>${sdaCache.replace(" SDA","")}</div>
    </div>
    `;

    // =====================
    // TOKEN CUSTOM (MAX 10)
    // =====================
    if(!customTokens) customTokens = [];

    const custom = customTokens.slice(0,10);

    custom.forEach(token => {

        //  FIX: pakai address, bukan tokenVal
        const cacheKey = wallet.address + "_" + token.address;

        const cached = localStorage.getItem(cacheKey) || ("0.00 " + token.symbol);

        html += `
        <div class="asset-item">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="${token.logo || 'img/default.png'}"
                     style="width:32px; height:32px; border-radius:50%;" />
                <div>
                    <b>${token.symbol}</b><br>
                    <small style="color:#888;">ERC20</small>
                </div>
            </div>

            <div style="display:flex; align-items:center; gap:6px;">
                <span>${cached.replace(" "+token.symbol,"")}</span>
                <button onclick="removeToken('${token.address}')"
                    style="width:auto; padding:2px 6px;">-</button>
            </div>
        </div>
        `;
    });

    container.innerHTML = html;
}


function renderTokenTab(){

    const container = document.getElementById("tab-tokens");

    let html = `
        <input type="text" id="searchToken"
            placeholder="Cari token..."
            style="margin-bottom:10px;" />
    `;

    DEFAULT_TOKENS.forEach(token => {

        const isAdded = customTokens.find(t => t.address === token.address);

        html += `
        <div class="asset-item token-row" data-symbol="${token.symbol.toLowerCase()}">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="${token.logo || 'img/default.png'}"
                     style="width:28px; height:28px; border-radius:50%;" />
                <div>${token.symbol}</div>
            </div>

            ${
                isAdded
                ? '<span style="color:#888;">Added</span>'
                : `<button onclick='addTokenFromList(${JSON.stringify(token)})'
                    style="width:auto;">+</button>`
            }
        </div>
        `;
    });

    container.innerHTML = html;

    //  aktifkan search
    initTokenSearch();
}



async function addTokenFromList(token){

    if(customTokens.length >= 10){
        return showToast("Max 10 token");
    }

    const exist = customTokens.find(t => t.address === token.address);
    if(exist){
        return showToast("Sudah ditambahkan");
    }

    //  tambah token
    customTokens.push(token);
    TOKENS = [...DEFAULT_TOKENS, ...customTokens];

    saveTokens();

    showToast("Token ditambahkan");

    const wallet = getSelectedWallet();

    //  langsung pindah tab biar UX cepat
    switchTab('assets');

    if(!wallet){
        renderAssets();
        return;
    }

    try{
        const abi = [
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)"
        ];

        const contract = new ethers.Contract(
            token.address,
            abi,
            provider
        );

        const bal = await contract.balanceOf(wallet.address);

        let decimals = 18;
        try{
            decimals = await contract.decimals();
        }catch{}

        const value = bal / (10 ** decimals);
        const final = parseFloat(value).toFixed(4) + " " + token.symbol;

        //  simpan cache
        const cacheKey = wallet.address + "_" + token.address;
        localStorage.setItem(cacheKey, final);

    }catch(e){
        console.warn("Fetch token gagal:", token.symbol);

        //  fallback biar ga kosong
        const cacheKey = wallet.address + "_" + token.address;
        if(!localStorage.getItem(cacheKey)){
            localStorage.setItem(cacheKey, "0.00 " + token.symbol);
        }
    }

    //  render terakhir (sekali aja, clean)
    renderAssets();
    renderTokenTab();
    renderTokenSelect();
}


function initTokenSearch(){

    const input = document.getElementById("searchToken");

    input.addEventListener("input", () => {

        const keyword = input.value.toLowerCase();

        document.querySelectorAll(".token-row").forEach(row => {

            const symbol = row.dataset.symbol;

            if(symbol.includes(keyword)){
                row.style.display = "flex";
            } else {
                row.style.display = "none";
            }

        });
    });
}

function removeToken(address){

    customTokens = customTokens.filter(
        t => t.address.toLowerCase() !== address.toLowerCase()
    );

    TOKENS = [...DEFAULT_TOKENS, ...customTokens];

    saveTokens();

    renderAssets();
    renderTokenTab();
    renderTokenSelect();

    showToast("Token dihapus");
}


function switchTab(tab){
    document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(el=>el.classList.remove("active"));

    document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add("active");
    document.getElementById("tab-"+tab).classList.add("active");
    if(tab === "assets") renderAssets();
if(tab === "tokens") renderTokenTab();
}

function isValidAddress(addr){
    return addr.startsWith("0x") && addr.length >= 42;
}

function validateInput(){
    const addr = addressInput.value.trim();

    if(isValidAddress(addr)){
        saveBtn.disabled = false;
    } else {
        saveBtn.disabled = true;
    }
}
